[workspace]
members = [
    "alkanes/cheeky-bricky-game",
    "alkanes/cheeky-bricky-game-runtime",
    "alkanes/cheeky-bricky-attacker",
    "alkanes/cheeky-bricky-operator",
    "crates/cheeky-bricky-math",
]
resolver = "2"

[package]
name = "cheeky-bricky-tests"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace.dependencies]
# Floating git deps + a Cargo.lock seeded from arbuzino's: both projects build
# against identical alkanes/metashrew revisions, and the sources unify with
# alkanes-rs's own internal metashrew dependency (a rev pin here would split
# the graph into two incompatible copies of metashrew_support).
alkanes = { git = "https://github.com/kungfuflex/alkanes-rs", features = ["test-utils"] }
alkanes-support = { git = "https://github.com/kungfuflex/alkanes-rs" }
alkanes-runtime = { git = "https://github.com/kungfuflex/alkanes-rs" }
metashrew-core = { git = "https://github.com/sandshrewmetaprotocols/metashrew", features = ["test-utils"] }
metashrew-support = { git = "https://github.com/sandshrewmetaprotocols/metashrew" }
protorune = { git = "https://github.com/kungfuflex/alkanes-rs", features = ["test-utils"] }
protorune-support = { git = "https://github.com/kungfuflex/alkanes-rs" }

anyhow = "1.0.75"
bitcoin = { version = "0.32", features = ["rand"] }

cheeky-bricky-math = { path = "crates/cheeky-bricky-math" }

[dev-dependencies]
alkanes = { workspace = true }
alkanes-runtime = { workspace = true }
alkanes-support = { workspace = true }
metashrew-core = { workspace = true }
metashrew-support = { workspace = true }
protorune = { workspace = true }
protorune-support = { workspace = true }
anyhow = { workspace = true }
bitcoin = { workspace = true }
cheeky-bricky-math = { workspace = true }
ordinals = { git = "https://github.com/kungfuflex/alkanes-rs" }
