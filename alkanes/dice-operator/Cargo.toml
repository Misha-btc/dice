[package]
name = "dice-operator"
version = "0.1.0"
edition = "2021"

# The operator auth key. A minimal, immutable token contract that holds NO
# funds: Init mints three interchangeable key units to the deployer, and each
# game table's WithdrawFees/SetExitFee requires one of them (hardcoded
# OPERATOR_AUTH_ID = 4:0xDEAD). Whoever holds a unit is the operator. Deploy it
# at the hardcoded slot BEFORE the game.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = { workspace = true }
metashrew-support = { workspace = true }
alkanes-support = { workspace = true }
alkanes-runtime = { workspace = true }
