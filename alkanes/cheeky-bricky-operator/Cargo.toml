[package]
name = "cheeky-bricky-operator"
version = "0.1.0"
edition = "2021"

# The operator auth key. A minimal, immutable token contract that holds NO
# funds: Init mints one key unit to the deployer, and each game table's
# WithdrawFees requires this key (hardcoded OPERATOR_AUTH_ID) to release its
# accrued 2% LP-exit fees. Whoever holds the key is the operator. Deploy it at
# the hardcoded slot BEFORE the game.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = { workspace = true }
metashrew-support = { workspace = true }
alkanes-support = { workspace = true }
alkanes-runtime = { workspace = true }
