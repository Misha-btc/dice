[package]
name = "cheeky-bricky-treasury"
version = "0.1.0"
edition = "2021"

# The operator's fee collector. The game (immutable, no privilege) accrues a
# 2% exit fee and permissionlessly sweeps it here; only the owner (whoever
# holds 1 unit of this contract, minted at deploy) can withdraw. Self-units
# are the owner key — no external auth-token factory needed.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = { workspace = true }
metashrew-support = { workspace = true }
alkanes-support = { workspace = true }
alkanes-runtime = { workspace = true }
